# Every push: the Nix packages on Linux (x86_64, arm64) and macOS (arm64, Intel),
# via Determinate Nix (the gateway's tests run in its build), and the test suite
# with plain Python on every platform with a release binary.
name: ci
on:
  push:
  pull_request:
jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix build -L .#gateway .#web .#lariat
      - run: nix run .#lariat -- --help
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'macOS' && runner.arch == 'X64'
        # No Intel wheel for cryptography: pip builds it, against Homebrew's OpenSSL.
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: pip install ./gateway
      - run: python -m unittest discover -s tests -t . -v
        working-directory: gateway
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install.sh
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
